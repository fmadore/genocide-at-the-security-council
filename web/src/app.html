<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!-- iOS reads neither the SVG icon nor the manifest's, and composites this
		     one onto black, which is why it is drawn on its own white ground. -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<!-- Every URL inside the manifest is relative to the manifest itself, so
		     the file needs no knowledge of the base path and survives the
		     BASE_PATH='' override that `svelte.config.js` documents. -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />

		<!-- Resolve the theme before first paint so there is no flash. Keep this
		     script inline and keep it above the SvelteKit head placeholder below;
		     naming that placeholder here would be enough for it to be substituted
		     inside this comment. The text font is preloaded from the layout rather
		     than here, because Vite fingerprints it and only the module graph
		     knows the emitted name. -->
		<script>
			(function () {
				try {
					var saved = localStorage.getItem('theme');
					var dark = saved
						? saved === 'dark'
						: window.matchMedia('(prefers-color-scheme: dark)').matches;
					document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				} catch (e) {
					/* private mode: fall through to the media query in app.css */
				}
			})();
		</script>

		<!-- The site is installable and never asks to be. Chromium fires this
		     event once it decides a page qualifies, and shows an install banner of
		     its own unless the event is cancelled; cancelling it and doing nothing
		     else is the whole intent. Nothing here stores the event or offers a
		     button, because a reader who wants an app already knows where their
		     browser keeps Install. Inline and early, beside the theme script: the
		     event can fire before the framework has hydrated, and a listener added
		     in `onMount` would sometimes be too late to cancel anything. -->
		<script>
			addEventListener('beforeinstallprompt', function (event) {
				event.preventDefault();
			});
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!--
		THESIS: A programme, not a dashboard. Every figure is a numbered plate that
		takes the whole width, with its notes beneath it; nothing is boxed, tiled or
		eyebrowed. It refuses the metric-tile-and-card overview.
		OWN-WORLD: Flat ink on white (reversed in dark), one Akzidenz-class grotesk
		(Hanken Grotesk) for everything, the typewriter mono only for the citation,
		3px rules opening the page and each plate, hairlines elsewhere, a
		twelve-column grid, UN flag blue for interaction only, the six register hues
		quarantined inside the plates, the marked word as the one warm thing on the
		page.
		STORY: A researcher arrives with a claim, reads the counted numbers, opens a
		plate, reads how to read it and what it does not show, and leaves with a
		citable figure or a meeting symbol.
		FIRST VIEWPORT: Heavy rule, wordmark and sections on one line; the title at
		3.25rem; the corpus counted as a field of unit squares with the marked share
		filled; then Plate 1 full width.
		FORM: The Programme Grid, candidate 6 of 7 on the grounded list, seed 426cd46f.
		FINISH: unreviewed and undocumented is unfinished; this build ends with the
		finish reviewer's verdict and the documenter's DESIGN.md.
		-->
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
