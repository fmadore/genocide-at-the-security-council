<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!-- iOS reads neither the SVG icon nor the manifest's, and composites this
		     one onto black, which is why it is drawn on its own white ground. -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<!-- Every URL inside the manifest is relative to the manifest itself, so
		     the file needs no knowledge of the base path and survives the
		     BASE_PATH='' override that `svelte.config.js` documents. -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="How the word genocide has been used at the UN Security Council, 1992-2023: 106,302 speeches, made searchable, comparable and citable."
		/>
		<meta name="theme-color" content="#f1f2ee" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#15181a" media="(prefers-color-scheme: dark)" />

		<!-- Card metadata is absolute: a scraper resolves it against no page. -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Genocide at the Security Council" />
		<meta
			property="og:description"
			content="When the word genocide was said at the UN Security Council, by whom, and what it was doing there. 106,302 speeches, 1992-2023."
		/>
		<meta property="og:url" content="https://fmadore.github.io/genocide-at-the-security-council/" />
		<meta
			property="og:image"
			content="https://fmadore.github.io/genocide-at-the-security-council/og.png"
		/>
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />

		<!-- Resolve the theme before first paint so there is no flash. Keep this
		     script inline and keep it above the SvelteKit head placeholder below;
		     naming that placeholder here would be enough for it to be substituted
		     inside this comment. The text font is preloaded from the layout rather
		     than here, because Vite fingerprints it and only the module graph
		     knows the emitted name. -->
		<script>
			(function () {
				try {
					var saved = localStorage.getItem('theme');
					var dark = saved
						? saved === 'dark'
						: window.matchMedia('(prefers-color-scheme: dark)').matches;
					document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				} catch (e) {
					/* private mode: fall through to the media query in app.css */
				}
			})();
		</script>

		<!-- The site is installable and never asks to be. Chromium fires this
		     event once it decides a page qualifies, and shows an install banner of
		     its own unless the event is cancelled; cancelling it and doing nothing
		     else is the whole intent. Nothing here stores the event or offers a
		     button, because a reader who wants an app already knows where their
		     browser keeps Install. Inline and early, beside the theme script: the
		     event can fire before the framework has hydrated, and a listener added
		     in `onMount` would sometimes be too late to cancel anything. -->
		<script>
			addEventListener('beforeinstallprompt', function (event) {
				event.preventDefault();
			});
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
