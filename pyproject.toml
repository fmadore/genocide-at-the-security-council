# Tooling configuration only — this repository is a pipeline, not a package.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "E501",  # long lines are checked by the formatter's judgement, not a hard stop
]

[tool.ruff.lint.per-file-ignores]
# The numbered scripts and tools insert scripts/ on sys.path before importing
# lib, so their imports cannot sit at the top of the file. Fifteen copies of the
# same four lines, and they stay: a module cannot be named `04_series`, so
# `python -m` is not available, and every way of removing the duplication hides
# what the scripts are doing to the path. A known cost, not an unexamined habit.
"scripts/[0-9]*.py" = ["E402"]
"tools/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Strict, so a misspelt marker or setting is an error rather than a test that
# silently stops being selected or configured. Coverage is reported on every
# run, CI's included, and never enforced: see [tool.coverage] below.
#
# CI runs everything. For a quick local loop, leave out the tests that run
# numbered scripts as subprocesses or search with hypothesis, and coverage:
#     python -m pytest -m "not slow" --no-cov
addopts = "-q --strict-markers --strict-config --cov --cov-report=term:skip-covered"
# A FutureWarning is pandas or numpy announcing that a result will change in a
# coming release; in a pipeline whose output is numbers, that is a failure to
# act on now, not a line to scroll past.
filterwarnings = ["error::DeprecationWarning", "error::FutureWarning"]
markers = [
    "slow: takes seconds rather than milliseconds; the end-to-end runs of numbered scripts and the property-based search",
]

[tool.coverage.run]
source = ["scripts", "tools"]
branch = true
# Under .pytest_cache/, which git ignores, rather than a `.coverage` file in the
# repository root that it does not.
data_file = ".pytest_cache/coverage/.coverage"
# The numbered scripts the end-to-end tests run as subprocesses are measured
# too: coverage starts in each child, and the data are combined at the end.
patch = ["subprocess"]

[tool.coverage.report]
# Report only. There is deliberately no `fail_under`: a threshold rewards tests
# written to touch lines rather than to check what the lines produce.
show_missing = false
skip_empty = true
