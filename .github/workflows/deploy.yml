# Build and deploy the SvelteKit dashboard to GitHub Pages.
#
# The `guard` job short-circuits the run while web/ has no package.json, so this
# workflow is green from the day it lands rather than failing until the app is
# scaffolded.
#
# Before the first real deployment:
#   1. Scaffold web/ with @sveltejs/adapter-static
#   2. Set `paths.base` in svelte.config.js to '/un-security-council-debates'
#      (project pages are served from a subpath)
#   3. Settings -> Pages -> Source: GitHub Actions
#
# Note: Pages from a *private* repository requires a paid GitHub plan. On a free
# account the repository must be public for the site to publish.

name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v7

      - id: check
        run: |
          if [ -f web/package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipped::web/ is not scaffolded yet — nothing to build."
          fi

  build:
    needs: guard
    if: needs.guard.outputs.ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run check --if-present
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
