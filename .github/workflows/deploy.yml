# Rebuild the pinned corpus and static dashboard, then deploy it to GitHub Pages.
#
# The 491 MB web payload is intentionally not committed. A deployment that has
# nothing to reuse starts from Harvard Dataverse v6.1, verifies its checksums,
# runs the versioned pipeline, and publishes the resulting static site. That
# costs build time, but makes a release reproducible from the DOI and the
# repository alone.
#
# Two caches keep that principle without paying it on every push. The pin is
# immutable — v6.1 cannot change, and its MD5s are fixed — so re-downloading
# 508 MB to move a grid column buys nothing, and this workflow triggers on
# `web/**`. Neither cache adds a trust assumption: the raw one is checksummed by
# `00_fetch_data.py` against the MD5s Harvard published, which are recorded in
# `config/dataset-pin.json` and so are checked whether or not the archive can be
# reached; the derived one is keyed on exactly the inputs
# `lib/artifacts.provenance` already claims determine an artifact. Both are an
# optimisation and never a dependency, and eviction is a feature.
#
# What is no longer a dependency is the archive itself on the path where nothing
# needs downloading. 00 asked the API for the file list before it could verify a
# corpus already on disk, so in August 2026 a bot challenge in front of Dataverse
# failed three deploys over a restored 508 MB cache it never looked at.

name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'web/**'
      - 'requirements.lock'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Not a preference — a correctness requirement for the derived cache key
      # below. Importing anything under `scripts/` writes `__pycache__`, a .pyc
      # records the mtime of the source it was compiled from, and a fresh
      # checkout stamps a new mtime every run. `hashFiles('scripts/**')` would
      # then differ between the restore and the save, and the cache would never
      # hit twice in a row while appearing to work.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - run: python -m pip install --require-hashes -r requirements.lock

      # Read from the one file that defines the pin, so the cache key and the
      # download can never disagree about which version is being built. With
      # sed rather than by importing lib.paths, for the reason in `env` above.
      - name: Read the dataset pin
        id: pin
        run: |
          version=$(sed -n 's/^DATASET_VERSION = "\(.*\)"$/\1/p' scripts/lib/paths.py)
          if [ -z "$version" ]; then
            echo "::error file=scripts/lib/paths.py::DATASET_VERSION not found — refusing to build a cache key that would be shared across pins"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Pinned dataset version $version"

      # Composed once and read by both the restore and the save, so the two
      # cannot be evaluated against different trees.
      #
      # The derived key is the input set that determines the payload: the
      # configs, the pipeline, the locked environment, the pin, and this file —
      # which names the Python version and the list of steps that run, and is
      # therefore an input like any other. A key that misses one of these would
      # ship a payload that does not match the code, which is the failure to
      # design against; every artifact still carries its own input hashes and
      # generating commit, so a miss stays detectable after the fact.
      - name: Compose the cache keys
        id: keys
        run: |
          {
            echo "raw=raw-v${{ steps.pin.outputs.version }}"
            echo "derived=derived-v${{ steps.pin.outputs.version }}-${{ hashFiles('config/**', 'scripts/**', 'requirements.lock', '.github/workflows/deploy.yml') }}"
          } >> "$GITHUB_OUTPUT"

      # No `restore-keys` on either, deliberately. A partial match is exactly
      # the payload-that-does-not-match-the-code failure: better to rebuild.
      - name: Restore the derived payload
        id: derived
        uses: actions/cache/restore@v6
        with:
          # Both, not just the payload the site ships: `data/derived/` holds the
          # manifests, which are what a release archives, and keeping the
          # inspectable artefacts beside the exported ones is what lets a hit be
          # audited rather than only served. Together roughly 0.9 GB here —
          # `embeddings/` and `lemmas/` are cluster-only (docs/CLUSTER.md) and
          # are never produced by this workflow.
          path: |
            data/derived
            web/static/data
          key: ${{ steps.keys.outputs.derived }}

      # Only when the payload has to be rebuilt. On a derived hit this workflow
      # makes no request to Dataverse at all, which is the whole point: a
      # `web/src/**`-only push should not touch an archive nobody here controls.
      - name: Restore the pinned corpus
        id: raw
        if: steps.derived.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: data/raw
          key: ${{ steps.keys.outputs.raw }}

      - name: Rebuild data payload from Dataverse v${{ steps.pin.outputs.version }}
        if: steps.derived.outputs.cache-hit != 'true'
        run: |
          # 00 is cache-aware already: it MD5-checks every local file and prints
          # `ok` rather than downloading, so a raw hit costs one API call for
          # the version lookup instead of 508 MB.
          python scripts/00_fetch_data.py
          python scripts/01_build_parquet.py
          python scripts/02_normalise.py
          python scripts/03_lexicon.py
          python scripts/04_series.py
          python scripts/05_lexical.py
          python scripts/08_kwic.py
          python scripts/09_export_speeches.py
          python scripts/11_countries.py
          # 12 writes into derived/countries/, which export_web copies wholesale.
          # The actor view has drawn it since 10 August 2026, and it would have to
          # run here regardless: leaving it out would ship a payload from this
          # workflow that a local run does not produce.
          python scripts/12_speaker_keyness.py
          python scripts/export_web.py

      # Saved explicitly rather than by letting `actions/cache` write in its own
      # post step, so that a run which failed part-way through the pipeline
      # cannot publish a half-built tree as a valid payload for this key. These
      # steps are reached only when every step above them succeeded.
      - name: Save the pinned corpus
        if: steps.derived.outputs.cache-hit != 'true' && steps.raw.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: data/raw
          key: ${{ steps.keys.outputs.raw }}

      - name: Save the derived payload
        if: steps.derived.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            data/derived
            web/static/data
          key: ${{ steps.keys.outputs.derived }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm --prefix web ci
      - run: npm --prefix web run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
