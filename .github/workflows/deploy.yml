# Rebuild the pinned corpus and static dashboard, then deploy it to GitHub Pages.
#
# The web payload is intentionally not committed. A deployment that has
# nothing to reuse starts from Harvard Dataverse, verifies its checksums, runs
# the versioned pipeline, and publishes the resulting static site. That costs
# build time, but makes a release reproducible from the DOI and the repository
# alone.
#
# Which dataset, and which version, this comment deliberately does not say. The
# build reads it from `DATASET_VERSION` in `scripts/lib/paths.py`, beside the
# file ids and MD5s in `config/dataset-pin.json`; a version repeated in prose is
# a version that outlives the migration that changed it. This header did exactly
# that, describing Schoenfeld et al. v6.1 from 4 September 2026, when the corpus
# became Sakamoto and Matsuoka v5.0, until 7 September — and nothing looked
# wrong, because the number went *down*.
#
# Two caches keep that principle without paying it on every push. A pin is
# immutable — the version cannot change under it, and its MD5s are fixed — so
# re-downloading 595 MB to move a grid column buys nothing, and this workflow
# triggers on `web/**`. Neither cache adds a trust assumption: the raw one is
# checksummed by `00_fetch_data.py` against the MD5s Harvard published, which
# are recorded in `config/dataset-pin.json` and so are checked whether or not
# the archive can be reached; the derived one is keyed on exactly the inputs
# `lib/artifacts.provenance` already claims determine an artifact. Both are an
# optimisation and never a dependency, and eviction is a feature.
#
# What is no longer a dependency is the archive itself on the path where nothing
# needs downloading. 00 asked the API for the file list before it could verify a
# corpus already on disk, so in August 2026 a bot challenge in front of Dataverse
# failed three deploys over a restored cache it never looked at.

name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - 'config/**'
      # The pipeline, less what the payload never runs: the cluster harness,
      # step 14 with its batches, probes and preflight, the GPU and diagnostic
      # steps, and prose. tests/test_build_graph.py fails if any of these
      # becomes something `make payload` runs. An edit to a `lib` module only
      # the cluster imports still starts a run, which then finds its payload
      # cached: the cache key, unlike this list, is read off the Makefile.
      - 'scripts/**'
      - '!scripts/cluster/**'
      - '!scripts/**/*.md'
      - '!scripts/06_*'
      - '!scripts/07_*'
      - '!scripts/10_*'
      - '!scripts/14_*'
      - '!scripts/18_*'
      - '!scripts/19_*'
      - '!scripts/21_*'
      - '!scripts/annotation_batches.py'
      - '!scripts/preflight_*'
      - '!scripts/probe_*'
      - '!scripts/score_intrusion.py'
      - 'web/**'
      # The two versioned annotation stores. 03 has read `annotations/` since it
      # existed and 15 reads both, yet neither triggered a build nor entered the
      # cache key below: an edit to a human annotation or a newly committed model
      # run left the published payload stale with nothing to say so.
      - 'annotations/**'
      - 'model_annotations/**'
      - 'requirements.lock'
      - 'Makefile'
      - 'tests/contract/payload.json'
      - '.github/workflows/deploy.yml'
      - '.github/actions/payload-cache-keys/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # A push that failed the checks used to deploy anyway. Calling them from
  # here, rather than waiting on the separate Checks run, keeps this
  # workflow's path filter: a `workflow_run` trigger would follow every Checks
  # run, whatever the push touched. The cost is that a push to main that
  # starts a deploy runs the checks twice, once in each workflow, about six
  # runner-minutes. The rebuild does not wait for them; only publishing does,
  # so a deploy takes as long as the slower of the two rather than their sum.
  # A flaky check now holds back a publish until it is re-run.
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Python writes to a pipe in blocks, so a step's output used to reach the
      # log in one piece when the step exited. Unbuffered, it arrives as it is
      # printed, and a slow step shows where its time goes.
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - run: python -m pip install --require-hashes -r requirements.lock

      # Composed once and read by both the restore and the save, so the two
      # cannot be evaluated against different trees. What the keys cover, and
      # why, is in the action, which the checks share so that they restore
      # exactly what this job saves.
      - name: Compose the cache keys
        id: keys
        uses: ./.github/actions/payload-cache-keys

      # No `restore-keys` on either, deliberately. A partial match is exactly
      # the payload-that-does-not-match-the-code failure: better to rebuild.
      - name: Restore the derived payload
        id: derived
        uses: actions/cache/restore@v6
        with:
          # Both, not just the payload the site ships: `data/derived/` holds the
          # manifests, which are what a release archives, and keeping the
          # inspectable artefacts beside the exported ones is what lets a hit be
          # audited rather than only served. Together roughly 0.9 GB here —
          # `embeddings/` and `lemmas/` are cluster-only (docs/CLUSTER.md) and
          # are never produced by this workflow.
          path: |
            data/derived
            web/static/data
          key: ${{ steps.keys.outputs.derived }}

      # Only when the payload has to be rebuilt. On a derived hit this workflow
      # makes no request to Dataverse at all, which is the whole point: a
      # `web/src/**`-only push should not touch an archive nobody here controls.
      - name: Restore the pinned corpus
        id: raw
        if: steps.derived.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: data/raw
          key: ${{ steps.keys.outputs.raw }}

      - name: Restore the pinned semantic release
        if: steps.derived.outputs.cache-hit != 'true'
        run: python scripts/fetch_semantic.py

      - name: Rebuild data payload from Dataverse v${{ steps.keys.outputs.version }}
        if: steps.derived.outputs.cache-hit != 'true'
        run: |
          # 00 is cache-aware already: it MD5-checks every local file and prints
          # `ok` rather than downloading, so a raw hit costs one API call for
          # the version lookup instead of the pinned corpus.
          # The step order lives in one place, the Makefile, which is the
          # pipeline's DAG: 00 through 15 and the export, with every input each
          # step reads declared beside it. It used to be copied here, in
          # scripts/README.md and in docs/CLUSTER.md, and the three drifted.
          # `raw` is phony and always runs 00, which MD5-checks the corpus on
          # disk; on an empty tree `payload` builds everything. 14 never runs
          # here: it needs a GPU, and 15 aggregates the committed run named in
          # model_annotations/genocide/current_run.txt, or writes the usage
          # artefacts in their waiting state when that file is empty.
          #
          # One step at a time, on purpose. After 03, the steps up to the
          # export are independent, and in run 37827234106 the sequence took
          # 24.3 minutes where `make -j3` would have finished with 12, at about
          # 17.5. But every step loads the corpus, about 1 GB of text and
          # several times that as Python objects, and this runner has 16 GB:
          # three at once could be killed for memory, which fails the deploy,
          # and their logs would interleave. The gain also applies only when
          # the payload cache misses. GNU time, where the runner has it,
          # prints each step's wall time and peak memory, which is the
          # measurement to decide on before trying -j.
          timed=python
          [ -x /usr/bin/time ] && timed="/usr/bin/time -f '    %e s, peak memory %M KB' python"
          make payload PY="$timed"

      # Saved explicitly rather than by letting `actions/cache` write in its own
      # post step, so that a run which failed part-way through the pipeline
      # cannot publish a half-built tree as a valid payload for this key. These
      # steps are reached only when every step above them succeeded.
      - name: Save the pinned corpus
        if: steps.derived.outputs.cache-hit != 'true' && steps.raw.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: data/raw
          key: ${{ steps.keys.outputs.raw }}

      - name: Save the derived payload
        if: steps.derived.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            data/derived
            web/static/data
          key: ${{ steps.keys.outputs.derived }}

      - name: Verify restored or rebuilt payload
        run: python scripts/export_web.py --check

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm --prefix web ci
      - run: npm --prefix web run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/build

  deploy:
    needs: [checks, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
