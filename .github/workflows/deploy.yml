# Rebuild the pinned corpus and static dashboard, then deploy it to GitHub Pages.
#
# The 488 MB web payload is intentionally not committed. Each deployment starts
# from Harvard Dataverse v6.1, verifies its checksums, runs the versioned pipeline,
# and publishes the resulting static site. This costs build time, but makes a
# release reproducible from the DOI and the repository alone.

name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'web/**'
      - 'requirements.lock'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - run: python -m pip install --require-hashes -r requirements.lock

      - name: Rebuild data payload from Dataverse v6.1
        run: |
          python scripts/00_fetch_data.py
          python scripts/01_build_parquet.py
          python scripts/02_normalise.py
          python scripts/03_lexicon.py
          python scripts/04_series.py
          python scripts/05_lexical.py
          python scripts/08_kwic.py
          python scripts/09_export_speeches.py
          python scripts/11_countries.py
          # 12 writes into derived/countries/, which export_web copies wholesale.
          # It runs here even though nothing draws it yet: leaving it out would
          # ship a payload from this workflow that a local run does not produce.
          python scripts/12_speaker_keyness.py
          python scripts/export_web.py

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm --prefix web ci
      - run: npm --prefix web run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
