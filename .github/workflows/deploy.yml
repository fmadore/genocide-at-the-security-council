# Build and deploy the SvelteKit dashboard to GitHub Pages.
#
# The `guard` job short-circuits the run when the payload the app reads is not
# present, so this workflow is green rather than red while that question is
# still open.
#
# **The payload is not in the repository and cannot be.** `web/static/data/` is
# 483 MB — 6,595 meeting files of full speech text, plus the concordance — and
# it is gitignored. Until one of these is chosen, a deploy would publish a site
# whose every chart 404s:
#
#   1. Run scripts 00-09 plus export_web.py in this workflow. ~630 MB from
#      Dataverse and a few minutes per deploy, cacheable on the DOI. Fully
#      reproducible from source; slowest CI.
#   2. Publish the payload as a release asset or a Hugging Face dataset and
#      fetch it in the build step. One upload per data version, fast CI, and the
#      artefact becomes something to version deliberately.
#   3. Build locally and deploy the built site. No CI data step, but
#      reproducibility then rests on one machine — the weakest option for a
#      project meant to be citable.
#
# GitHub Pages allows 1 GB, so the size is not the obstacle; where the bytes
# come from at build time is. See notes/09_export_speeches.md.
#
# Before the first real deployment:
#   1. Choose one of the three above and implement it in the `build` job
#   2. Settings -> Pages -> Source: GitHub Actions
#
# Note: Pages from a *private* repository requires a paid GitHub plan. On a free
# account the repository must be public for the site to publish.

name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v7

      - id: check
        run: |
          if [ ! -f web/package.json ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipped::web/ is not scaffolded yet."
          elif [ ! -f web/static/data/manifest.json ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipped::web/static/data is empty. The 483 MB payload is \
            gitignored and no build-time source is configured yet — see the comment at the \
            top of this file. Deploying now would publish a site with no data."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: guard
    if: needs.guard.outputs.ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
