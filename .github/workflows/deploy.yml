# Build and deploy the SvelteKit dashboard to GitHub Pages.
#
# Inactive until web/ is scaffolded: the path filter means no run is triggered
# by pipeline or documentation commits.
#
# Before the first real deployment:
#   1. Scaffold web/ with @sveltejs/adapter-static
#   2. Set `paths.base` in svelte.config.js to '/<repo-name>' for project pages
#   3. Settings → Pages → Source: GitHub Actions
#
# Note: Pages from a *private* repository requires a paid GitHub plan. On a free
# account the repository must be public for the site to publish.

name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run check --if-present
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
