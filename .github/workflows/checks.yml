# Lint and test both halves of the project.
#
# Deliberately not path-filtered. The failure this guards against is a bad edit
# to config/entities.csv, config/lexicon.yml or config/council_membership.csv —
# tests/test_config.py runs against those real files — and any path filter that
# forgets one reintroduces exactly the gap it was meant to close. Neither job
# needs data or network beyond its own package installs.
#
# The deploy calls this file too (`workflow_call`) and publishes only when every
# job here passes.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # `github.workflow` in the group because a called workflow runs under its
  # caller's name. With a fixed prefix, the deploy's copy of these checks and
  # the standalone run for the same push would share a group, and each would
  # cancel the other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - run: python -m pip install --require-hashes -r requirements.lock

      # `ruff format --check` is not run: the source is hand-formatted and
      # reformatting it wholesale is a separate decision, not a CI failure.
      - name: ruff
        run: ruff check --output-format=github .

      - name: pytest
        run: python -m pytest

  # The transport tests exercise step 14's real request path through the
  # OpenAI-compatible client, and skip without it. The job above must not have
  # it — its absence is what proves the lazy import — so they run here, in an
  # environment that has the client and fails before pytest if it does not.
  annotation:
    name: Annotation transport
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - run: python -m pip install --require-hashes -r requirements.lock

      - run: python -m pip install -r requirements-llm.txt

      # Its HTTP library comes with it (httpx2 from openai 3.24, httpx before),
      # and the transport test uses whichever the installed client is built on.
      - name: The client is importable, so nothing below can skip
        run: python -c "import openai"

      - name: pytest (transport and preflight)
        run: python -m pytest tests/test_annotate_transport.py tests/test_annotation_preflight.py -rs

  web:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # svelte-check needs the generated types, which `npm ci` does not produce.
      - run: npx svelte-kit sync

      - name: prettier and eslint
        run: npm run lint

      - name: svelte-check
        run: npm run check

      - name: vitest
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e

      - name: Playwright service worker
        run: npm run test:e2e:sw
