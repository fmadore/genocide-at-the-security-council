# Lint and test both halves of the project.
#
# Deliberately not path-filtered. The failure this guards against is a bad edit
# to config/entities.csv, config/lexicon.yml or config/council_membership.csv —
# tests/test_config.py runs against those real files — and any path filter that
# forgets one reintroduces exactly the gap it was meant to close. No job needs
# network beyond its own package installs, and none builds data: the dashboard
# job borrows the deploy's cached payload when one matches these inputs.
#
# Every job has a timeout several times its usual length, so a hung browser or
# install fails in minutes rather than after GitHub's six-hour default.
#
# The deploy calls this file too (`workflow_call`) and publishes only when every
# job here passes.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # `github.workflow` in the group because a called workflow runs under its
  # caller's name. With a fixed prefix, the deploy's copy of these checks and
  # the standalone run for the same push would share a group, and each would
  # cancel the other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - run: python -m pip install --require-hashes -r requirements.lock

      # `ruff format --check` is not run: the source is hand-formatted and
      # reformatting it wholesale is a separate decision, not a CI failure.
      - name: ruff
        run: ruff check --output-format=github .

      # Over scripts/lib only, as configured in pyproject.toml.
      - name: mypy
        run: python -m mypy

      - name: pytest
        run: python -m pytest --cov --cov-report=term:skip-covered

  # The transport tests exercise step 14's real request path through the
  # OpenAI-compatible client, and skip without it. The job above must not have
  # it — its absence is what proves the lazy import — so they run here, in an
  # environment that has the client and fails before pytest if it does not.
  annotation:
    name: Annotation transport
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - run: python -m pip install --require-hashes -r requirements.lock

      - run: python -m pip install -r requirements-llm.txt

      # Its HTTP library comes with it (httpx2 from openai 3.24, httpx before),
      # and the transport test uses whichever the installed client is built on.
      - name: The client is importable, so nothing below can skip
        run: python -c "import openai"

      - name: pytest (transport and preflight)
        run: python -m pytest tests/test_annotate_transport.py tests/test_annotation_preflight.py -rs

  # The Slurm scripts run unattended on a batch node, hours after submission,
  # where a mistake costs a reservation. tests/test_cluster.py checks what they
  # say; these check that they parse and hold up as shell.
  cluster:
    name: Cluster scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: bash -n
        run: |
          status=0
          for script in scripts/cluster/*.sh; do
            bash -n "$script" || status=1
          done
          exit "$status"

      # A pinned, checksummed release rather than the runner's own copy, whose
      # version moves with the image. scripts/cluster/.shellcheckrc tells it to
      # follow env.sh.
      - name: Install shellcheck
        env:
          VERSION: v0.11.0
          SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL -o "$archive" "https://github.com/koalaman/shellcheck/releases/download/$VERSION/shellcheck-$VERSION.linux.x86_64.tar.xz"
          echo "$SHA256  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-$VERSION" >> "$GITHUB_PATH"

      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck scripts/cluster/*.sh

  web:
    name: Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # svelte-check needs the generated types, which `npm ci` does not produce.
      - run: npx svelte-kit sync

      - name: prettier and eslint
        run: npm run lint

      - name: svelte-check
        run: npm run check

      - name: vitest
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e

      - name: Playwright service worker
        run: npm run test:e2e:sw

      # Prerendering as the deploy runs it: production settings, every route
      # crawled, a failed request fatal, then scripts/verify-static.mjs. The
      # browser tests above build only their fixture routes, with failures
      # downgraded to warnings, so a prerender error used to surface only in
      # the deploy. Prerendering needs the real payload, which only the deploy
      # builds, so this restores the one the deploy cached for exactly these
      # pipeline inputs, last, where it cannot touch the tests above. A change
      # to the pipeline has no such payload yet and is left to the deploy's
      # own build, which also blocks publishing when it fails.
      - name: Compose the payload cache key
        id: keys
        uses: ./.github/actions/payload-cache-keys

      - name: Restore the deploy's payload
        id: payload
        uses: actions/cache/restore@v6
        with:
          # The paths the deploy saves, in the same order: an entry is found
          # only under both the key and the path list it was saved with.
          path: |
            data/derived
            web/static/data
          key: ${{ steps.keys.outputs.derived }}

      - name: Production build and static checks
        if: steps.payload.outputs.cache-hit == 'true'
        run: npm run build

      - name: No payload cached for these inputs
        if: steps.payload.outputs.cache-hit != 'true'
        run: echo "::notice::No deploy payload is cached for this pipeline yet, so the production build is left to the deploy."
