# Lint and test both halves of the project.
#
# Deliberately not path-filtered. The failure this guards against is a bad edit
# to config/entities.csv, config/lexicon.yml or config/council_membership.csv —
# tests/test_config.py runs against those real files — and any path filter that
# forgets one reintroduces exactly the gap it was meant to close. Neither job
# needs data or network beyond its own package installs.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - run: python -m pip install --require-hashes -r requirements.lock

      # `ruff format --check` is not run: the source is hand-formatted and
      # reformatting it wholesale is a separate decision, not a CI failure.
      - name: ruff
        run: ruff check --output-format=github .

      - name: pytest
        run: python -m pytest

  web:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # svelte-check needs the generated types, which `npm ci` does not produce.
      - run: npx svelte-kit sync

      - name: prettier and eslint
        run: npm run lint

      - name: svelte-check
        run: npm run check

      - name: vitest
        run: npm test
