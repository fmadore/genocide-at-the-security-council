# Weekly, grouped, so an update is one reviewable pull request per ecosystem
# rather than one per package. The Python lock is regenerated with hashes from
# `requirements.txt`; Dependabot proposes the range change and the lock follows.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ['*']
    ignore:
      # TypeScript 7 cannot be installed beside the toolchain yet: on 11 October
      # 2026 svelte-check 4.7.6 and SvelteKit 3.0.1 accept TypeScript ^5 or ^6,
      # and typescript-eslint 8.71.1 accepts <6.1, so `npm ci` stops on a peer
      # conflict and none of the checks run. Remove this once all three accept 7.
      - dependency-name: typescript
        versions: ['>=7']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
