# Repairs to the Sakamoto-Matsuoka v6.0 source, applied by step 01.
#
# data/raw/ is never edited: step 01 reads the pinned TSVs and applies these
# repairs to the frame before anything else sees it. Each repair names what it
# expects to find (a duplicate record word for word, a text checksum, a label at
# an offset) and step 01 stops if the source does not match, so a new source
# release cannot be "repaired" by a rule written for another one.
#
# Each repair must be checked against the original UN record, with the evidence
# recorded in docs/VALIDATION.md.
#
# None is needed for v6.0. The four repairs v5.0 needed (S/PV.869, S/PV.906,
# S/PV.1379 and S/PV.2622) were reported to the dataset's authors, who fixed all
# four in v6.0, released on 31 October 2026; docs/VALIDATION.md, check 8, has
# the record. The forms a repair can take are documented with
# `lib.sakamoto.apply_repairs` and tested in tests/test_source_repairs.py.

schema: 1
source: Sakamoto-Matsuoka v6.0

# A meeting record whose every speech is a copy of another record's.
drop_records: []

# Speeches that repeat, one for one, speeches of another record.
drop_speeches: []

# A speech whose text runs on past the end of its record.
trim_speeches: []

# A speech that runs on into the next speaker's turn.
split_speeches: []
