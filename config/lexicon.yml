# Genocide lexicon — versioned, auditable, register-tagged.
#
# Consumed by scripts/03_lexicon.py. Patterns are Python regex, applied
# case-insensitively to the speech body (after the opening form of address has
# been stripped).
#
# `register` groups terms into the four discursive families that emerged from
# the collocate analysis (see docs/CORPUS.md §8.5). `tier` marks how central a
# term is to the object of study:
#   core     — the word itself
#   atrocity — the Rome Statute / R2P cluster it travels inside
#   adjacent — the accountability vocabulary that surrounds both
#
# `prefilters` exist for speed and for nothing else: a speech containing none of
# them is skipped without running the regex. A literal must therefore be
# contained, case-insensitively, in *every* string its pattern can match —
# otherwise the fast path silently loses occurrences. It must contain no
# whitespace: the records keep their hard line breaks, and `\s+` in a pattern
# spans a newline, a tab or a double space that a multi-word literal never
# will. Prefer one distinctive word per alternative of the pattern.
#
# `pattern_since` is the lexicon version at which that term's `pattern` last
# changed. Bump it to the new `version` whenever you edit a pattern, and leave
# it alone otherwise: it is what lets an artefact keyed to a single term — a
# gold sample, a committed model run — survive a version bump that did not
# touch that term. See `Lexicon.compatible` in scripts/lib/lexicon.py.
#
# Changing this file changes every downstream count. Bump `version` and record
# what moved.
#
# v3 — 2026-09-01
#   - prefilters rewritten as whitespace-free literals, so a phrase broken
#     across a line break ("war\ncrimes") is counted rather than dropped by the
#     fast path.
#   - register and total roll-ups no longer double-count a term nested under
#     another term in the same sum (lib/lexicon.py::apply).
#   - no `pattern` changed: every term keeps `pattern_since: 2`, so the gold
#     sample and the committed model runs recorded against v2 remain valid.

version: 3
updated: 2026-09-01

terms:
  genocide:
    pattern: '\bgenocid\w*'
    prefilters: [genocid]
    examples: [genocide, genocidal, genocides, genocidaires]
    tier: core
    register: core
    pattern_since: 2
    note: >
      Matches genocide, genocidal, genocides, genocidaire(s). 6,092 occurrences
      across 3,273 speeches.

  genocide_ocr_variants:
    pattern: '\b(?:gen[eo]cid|senocid|qenocid)\w*'
    prefilters: [genocid, genecid, senocid, qenocid]
    examples: [genecide, senocide, qenocidal]
    tier: core
    register: core
    pattern_since: 2
    enabled: false
    note: >
      OCR-tolerant net. Keep disabled by default and report the delta against
      `genocide` separately — silently absorbing OCR noise into the headline
      count would be dishonest.

  ethnic_cleansing:
    pattern: '\bethnic(?:ally)?[\s-]+cleans\w*'
    prefilters: [cleans]
    examples: [ethnic cleansing, ethnically-cleansed]
    tier: atrocity
    register: legal
    pattern_since: 2

  crimes_against_humanity:
    pattern: '\bcrimes?\s+against\s+humanity'
    prefilters: [humanity]
    examples: [crime against humanity, crimes against humanity]
    tier: atrocity
    register: legal
    pattern_since: 2

  war_crimes:
    pattern: '\bwar\s+crimes?\b'
    prefilters: [crime]
    examples: [war crime, war crimes]
    tier: atrocity
    register: legal
    pattern_since: 2

  mass_atrocity:
    pattern: '\bmass\s+atrocit(?:y|ies)\b'
    prefilters: [atroc]
    examples: [mass atrocity, mass atrocities]
    tier: atrocity
    register: legal
    pattern_since: 2
    nested_under: atrocity

  atrocity:
    pattern: '\batrocit(?:y|ies)\b'
    prefilters: [atroc]
    examples: [atrocity, atrocities]
    tier: adjacent
    register: legal
    pattern_since: 2

  extermination:
    pattern: '\bexterminat\w*'
    prefilters: [exterminat]
    examples: [exterminate, extermination, exterminating]
    tier: adjacent
    register: legal
    pattern_since: 2

  genocide_convention:
    pattern: '\bgenocide\s+convention\b|\bconvention\s+on\s+the\s+prevention\s+and\s+punishment'
    prefilters: [convention]
    examples: [Genocide Convention, Convention on the Prevention and Punishment]
    tier: core
    register: legal
    pattern_since: 2
    nested_under: genocide

  responsibility_to_protect:
    pattern: '\bresponsibility\s+to\s+protect\b|\bR2P\b'
    prefilters: [protect, r2p]
    examples: [responsibility to protect, R2P]
    tier: atrocity
    register: preventive
    pattern_since: 2

  prevention_of_genocide:
    pattern: '\b(?:prevention|preventing)\s+of\s+genocide\b|special\s+adviser\s+on\s+the\s+prevention'
    prefilters: [prevent]
    examples: [prevention of genocide, Special Adviser on the Prevention]
    tier: core
    register: preventive
    pattern_since: 2
    nested_under: genocide

  early_warning:
    pattern: '\bearly\s+warning\b'
    prefilters: [warning]
    examples: [early warning]
    tier: adjacent
    register: preventive
    pattern_since: 2

  never_again:
    pattern: '\bnever\s+again\b'
    prefilters: [never]
    examples: [never again]
    tier: adjacent
    register: commemorative
    pattern_since: 2
    note: >
      Filtered on `never` rather than `again`: "again" is a substring of
      "against", which is everywhere in this corpus, so it would filter nothing.

  holocaust:
    pattern: '\bholocaust\b|\bshoah\b'
    prefilters: [holocaust, shoah]
    examples: [Holocaust, Shoah]
    tier: adjacent
    register: commemorative
    pattern_since: 2

  commemoration:
    pattern: '\bcommemorat\w*|\banniversar\w+'
    prefilters: [commemorat, anniversar]
    examples: [commemoration, commemorating, anniversary]
    tier: adjacent
    register: commemorative
    pattern_since: 2

  survivors:
    pattern: '\bsurvivors?\b'
    prefilters: [survivor]
    examples: [survivor, survivors]
    tier: adjacent
    register: commemorative
    pattern_since: 2

  denial:
    pattern: '\bdenial\b|\bdeny\w*\s+(?:the\s+)?genocid\w*|\bgenocide\s+denial\b'
    prefilters: [denial, deny]
    examples: [denial, denying the genocide, genocide denial]
    tier: adjacent
    register: contentious
    pattern_since: 2

  glorification:
    pattern: '\bglorif\w+'
    prefilters: [glorif]
    examples: [glorification, glorifying]
    tier: adjacent
    register: contentious
    pattern_since: 2

  genocidal_ideology:
    pattern: '\bgenocidal\s+ideolog\w+|\bideolog\w+\s+of\s+genocide\b'
    prefilters: [ideolog]
    examples: [genocidal ideology, ideology of genocide]
    tier: core
    register: contentious
    pattern_since: 2
    nested_under: genocide

  ethnic_hatred:
    pattern: '\bethnic\s+(?:hatred|violence|conflict)'
    prefilters: [ethnic]
    examples: [ethnic hatred, ethnic violence, ethnic conflict]
    tier: adjacent
    register: contentious
    pattern_since: 2

  impunity:
    pattern: '\bimpunity\b'
    prefilters: [impunity]
    examples: [impunity]
    tier: adjacent
    register: accountability
    pattern_since: 2

  icc:
    pattern: '\binternational\s+criminal\s+court\b|\bICC\b'
    prefilters: [criminal, icc]
    examples: [International Criminal Court, ICC]
    tier: adjacent
    register: accountability
    pattern_since: 2

  tribunals:
    pattern: '\b(?:ICTR|ICTY)\b|international\s+(?:criminal\s+)?tribunal'
    prefilters: [ictr, icty, tribunal]
    examples: [ICTR, ICTY, international criminal tribunal, international tribunal]
    tier: adjacent
    register: accountability
    pattern_since: 2

# Convenience groupings used by the dashboard's filter chips.
sets:
  core: [genocide, genocide_convention, prevention_of_genocide, genocidal_ideology]
  atrocity_core: [genocide, ethnic_cleansing, crimes_against_humanity, war_crimes, mass_atrocity]
  rome_triad: [genocide, war_crimes, crimes_against_humanity]
  r2p_quartet: [genocide, war_crimes, crimes_against_humanity, ethnic_cleansing]
